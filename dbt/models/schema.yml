version: 2

models:
  - name: daily_station_departures
    description: "Scheduled departure events aggregated by GTFS service date and station."
    columns:
      - name: service_date
        data_tests: [not_null]
      - name: station_id
        data_tests: [not_null]
      - name: station_name
        data_tests: [not_null]
      - name: scheduled_departures
        data_tests: [not_null]

  - name: hourly_departures
    description: "Eligible GTFS departure events by service date and hour (0-23)."
    columns:
      - name: service_date
        data_tests: [not_null]
      - name: departure_hour
        data_tests: [not_null]
      - name: scheduled_departures
        data_tests: [not_null]

  - name: train_service_summary
    description: "Trips and eligible departure events by service date and train category."
    columns:
      - name: service_date
        data_tests: [not_null]
      - name: train_category
        data_tests: [not_null]
      - name: scheduled_trips
        data_tests: [not_null]
