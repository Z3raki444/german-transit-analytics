
services:

  # PostgreSQL Database
  postgres:
    image: postgres:17
    container_name: german-transit-postgres

    environment:
      POSTGRES_USER: transit_user
      POSTGRES_PASSWORD: "${DBT_ENV_SECRET_TRANSIT_DB_PASSWORD:?Database password required}"
      POSTGRES_DB: transit_analytics

    ports:
      - "127.0.0.1:5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/init:/docker-entrypoint-initdb.d:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U transit_user -d transit_analytics"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Apache Airflow
  airflow:
    build:
      context: .
      dockerfile: Dockerfile.airflow

    image: german-transit-airflow:local
    container_name: german-transit-airflow

    command: standalone

    ports:
      - "127.0.0.1:8081:8080"

    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"

      TRANSIT_DB_HOST: postgres
      TRANSIT_DB_PORT: "5432"
      TRANSIT_DB_PASSWORD: "${DBT_ENV_SECRET_TRANSIT_DB_PASSWORD:?Database password required}"

      DBT_ENV_SECRET_TRANSIT_DB_PASSWORD: "${DBT_ENV_SECRET_TRANSIT_DB_PASSWORD:?Database password required}"

      DBT_ENGINE_LOG_PATH: /tmp/dbt_logs
      DBT_ENGINE_TARGET_PATH: /tmp/dbt_target

    volumes:
      - airflow_data:/opt/airflow
      - ./airflow/dags:/opt/airflow/dags
      - ./src:/opt/airflow/project/src:ro
      - ./data:/opt/airflow/project/data
      - ./run_etl.py:/opt/airflow/project/run_etl.py:ro
      - ./dbt:/opt/airflow/project/dbt

    depends_on:
      postgres:
        condition: service_healthy

  # dbt Analytics
  dbt:
    build:
      context: .
      dockerfile: Dockerfile.dbt

    image: german-transit-dbt:local
    working_dir: /usr/app

    environment:
      DBT_ENV_SECRET_TRANSIT_DB_PASSWORD: "${DBT_ENV_SECRET_TRANSIT_DB_PASSWORD:?Database password required}"

    volumes:
      - ./dbt:/usr/app

    entrypoint: ["dbt"]

    depends_on:
      postgres:
        condition: service_healthy

  # Streamlit Dashboard
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard

    image: german-transit-dashboard:local
    container_name: german-transit-dashboard

    ports:
      - "127.0.0.1:8501:8501"

    environment:
      TRANSIT_DB_HOST: postgres
      TRANSIT_DB_PORT: "5432"
      TRANSIT_DB_PASSWORD: "${DBT_ENV_SECRET_TRANSIT_DB_PASSWORD:?Database password required}"

    depends_on:
      postgres:
        condition: service_healthy

    restart: unless-stopped

volumes:
  postgres_data:
  airflow_data:
