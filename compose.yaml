
services:
  postgres:
    image: postgres:17
    container_name: german-transit-postgres

    environment:
      POSTGRES_USER: transit_user
      POSTGRES_PASSWORD: local_dev_password
      POSTGRES_DB: transit_analytics

    ports:
      - "127.0.0.1:5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U transit_user -d transit_analytics"]
      interval: 10s
      timeout: 5s
      retries: 5

  airflow:
    build:
      context: .
      dockerfile: Dockerfile.airflow

    image: german-transit-airflow:local
    container_name: german-transit-airflow

    command: standalone

    ports:
      - "127.0.0.1:8080:8080"

    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"

      # PostgreSQL connection
      TRANSIT_DB_HOST: postgres
      TRANSIT_DB_PORT: "5432"
      TRANSIT_DB_PASSWORD: local_dev_password

    volumes:
      - airflow_data:/opt/airflow
      - ./airflow/dags:/opt/airflow/dags
      - ./src:/opt/airflow/project/src:ro
      - ./data:/opt/airflow/project/data
      - ./run_etl.py:/opt/airflow/project/run_etl.py:ro

    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  airflow_data:
