
services:

  # 1. PostgreSQL Database
  postgres:
    image: postgres:17
    container_name: german-transit-postgres

    environment:
      POSTGRES_USER: transit_user
      POSTGRES_PASSWORD: local_dev_password
      POSTGRES_DB: transit_analytics

    ports:
      - "127.0.0.1:5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U transit_user -d transit_analytics"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Apache Airflow
  airflow:
    build:
      context: .
      dockerfile: Dockerfile.airflow

    image: german-transit-airflow:local
    container_name: german-transit-airflow

    command: standalone

    ports:
      - "127.0.0.1:8080:8080"

    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      TRANSIT_DB_HOST: postgres
      TRANSIT_DB_PORT: "5432"
      TRANSIT_DB_PASSWORD: local_dev_password

    volumes:
      - airflow_data:/opt/airflow
      - ./airflow/dags:/opt/airflow/dags
      - ./src:/opt/airflow/project/src:ro
      - ./data:/opt/airflow/project/data
      - ./run_etl.py:/opt/airflow/project/run_etl.py:ro

    depends_on:
      postgres:
        condition: service_healthy

  # 3. dbt Analytics
  dbt:
    build:
      context: .
      dockerfile: Dockerfile.dbt

    image: german-transit-dbt:local

    working_dir: /usr/app

    environment:
      DBT_ENV_SECRET_TRANSIT_DB_PASSWORD: "${DBT_ENV_SECRET_TRANSIT_DB_PASSWORD:?Password missing from .env}"

    volumes:
      - ./dbt:/usr/app

    entrypoint: ["dbt"]

    depends_on:
      postgres:
        condition: service_healthy

  # 4. Streamlit Dashboard
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard

    image: german-transit-dashboard:local
    container_name: german-transit-dashboard

    ports:
      - "127.0.0.1:8501:8501"

    environment:
      TRANSIT_DB_HOST: postgres
      TRANSIT_DB_PORT: "5432"
      TRANSIT_DB_PASSWORD: "${DBT_ENV_SECRET_TRANSIT_DB_PASSWORD:?Database password required}"

    depends_on:
      postgres:
        condition: service_healthy

    restart: unless-stopped

  # 5. Apache Kafka
  kafka:
    image: apache/kafka:4.3.1
    container_name: german-transit-kafka
    hostname: kafka

    ports:
      - "127.0.0.1:9092:9092"

    environment:
      KAFKA_NODE_ID: 1

      KAFKA_PROCESS_ROLES: "broker,controller"

      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:29093"

      KAFKA_LISTENERS: "CONTROLLER://:29093,PLAINTEXT://:19092,PLAINTEXT_HOST://:9092"

      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:9092"

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"

      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"

      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"

      CLUSTER_ID: "4L6g3nShT-eMCtK--X86sw"

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1

      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1

      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1

      KAFKA_LOG_DIRS: "/var/lib/kafka/data"

    volumes:
      - kafka_data:/var/lib/kafka/data

volumes:
  postgres_data:
  airflow_data:
  kafka_data:
